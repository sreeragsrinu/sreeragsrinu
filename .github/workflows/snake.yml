name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Green Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: sreeragsrinu
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=00FF00&color_dots=%23000000,%23003300,%23006600,%2300CC00,%2300FF00

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
